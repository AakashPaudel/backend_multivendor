memory_limit=512M
upload_max_filesize=64M
post_max_size=64M
max_execution_time=120
max_input_vars=5000
display_errors=On
log_errors=On
error_reporting=E_ALL
date.timezone=Asia/Kathmandu
sys_temp_dir=/var/www/html/storage/tmp
upload_tmp_dir=/var/www/html/storage/tmp
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
