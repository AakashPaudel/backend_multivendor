services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${WWWUSER}
        GID: ${WWWGROUP}
    image: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./Docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./Docker/policy/policy.xml:/etc/ImageMagick-6/policy.xml
      - composer-cache:/tmp/composer
    environment:
      APP_ENV: ${APP_ENV}
      CONTAINER_ROLE: app
      MAGICK_POLICY_PATH: /etc/ImageMagick-6/policy.xml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www/html
      - ./Docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal
      - edge
    labels:
      - "traefik.enable=${APP_DOMAIN_ENABLED}"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-app.loadbalancer.server.port=80"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-http-nonwww.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-http-nonwww.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-http-nonwww.service=${COMPOSE_PROJECT_NAME}-app"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-http-nonwww.middlewares=redirect-to-${APP_PROTOCOL}-${APP_REDIRECT_TO}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-nonwww.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-nonwww.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-nonwww.tls=${APP_NONWWW_TLS_ENABLED}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-nonwww.tls.certresolver=myresolver"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-nonwww.service=${COMPOSE_PROJECT_NAME}-app"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-nonwww.middlewares=redirect-to-${APP_PROTOCOL}-${APP_REDIRECT_TO}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-http-www.rule=Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-http-www.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-http-www.service=${COMPOSE_PROJECT_NAME}-app"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-http-www.middlewares=redirect-to-${APP_PROTOCOL}-${APP_REDIRECT_TO}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-www.rule=Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-www.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-www.tls=${APP_WWW_TLS_ENABLED}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-www.tls.certresolver=myresolver"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-www.service=${COMPOSE_PROJECT_NAME}-app"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app-https-www.middlewares=redirect-to-${APP_PROTOCOL}-${APP_REDIRECT_TO}"

  queue:
    image: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["queue-worker"]
    volumes:
      - ./:/var/www/html
      - ./Docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./Docker/policy/policy.xml:/etc/ImageMagick-6/policy.xml
      - composer-cache:/tmp/composer
    environment:
      APP_ENV: ${APP_ENV}
      CONTAINER_ROLE: queue
      MAGICK_POLICY_PATH: /etc/ImageMagick-6/policy.xml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    image: ${COMPOSE_PROJECT_NAME}-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["scheduler"]
    volumes:
      - ./:/var/www/html
      - ./Docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./Docker/policy/policy.xml:/etc/ImageMagick-6/policy.xml
      - composer-cache:/tmp/composer
    environment:
      APP_ENV: ${APP_ENV}
      CONTAINER_ROLE: scheduler
      MAGICK_POLICY_PATH: /etc/ImageMagick-6/policy.xml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      DB_TEST_DATABASE: ${DB_TEST_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./Docker/mysql/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  pma:
    profiles:
      - db-admin
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FORWARD_PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI}
      MAX_EXECUTION_TIME: 16000
      MEMORY_LIMIT: 1024M
      UPLOAD_LIMIT: 1024M
    networks:
      - internal
      - edge
    labels:
      - "traefik.enable=${PMA_DOMAIN_ENABLED}"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-pma.loadbalancer.server.port=80"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-http-nonwww.rule=Host(`${PMA_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-http-nonwww.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-http-nonwww.service=${COMPOSE_PROJECT_NAME}-pma"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-http-nonwww.middlewares=redirect-to-${PMA_PROTOCOL}-${PMA_REDIRECT_TO}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-nonwww.rule=Host(`${PMA_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-nonwww.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-nonwww.tls=${PMA_NONWWW_TLS_ENABLED}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-nonwww.tls.certresolver=myresolver"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-nonwww.service=${COMPOSE_PROJECT_NAME}-pma"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-nonwww.middlewares=redirect-to-${PMA_PROTOCOL}-${PMA_REDIRECT_TO}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-http-www.rule=Host(`www.${PMA_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-http-www.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-http-www.service=${COMPOSE_PROJECT_NAME}-pma"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-http-www.middlewares=redirect-to-${PMA_PROTOCOL}-${PMA_REDIRECT_TO}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-www.rule=Host(`www.${PMA_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-www.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-www.tls=${PMA_WWW_TLS_ENABLED}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-www.tls.certresolver=myresolver"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-www.service=${COMPOSE_PROJECT_NAME}-pma"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-pma-https-www.middlewares=redirect-to-${PMA_PROTOCOL}-${PMA_REDIRECT_TO}"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  composer-cache:
  mysql-data:
  redis-data:

networks:
  internal:
    driver: bridge
  edge:
    name: ${TRAEFIK_NETWORK_NAME:-traefik-network}
    external: true